name: CI Services QA

on:
  push:
    branches:
      - qa
      - 'feature/**'
    paths-ignore:
      - 'terraform/**'
  pull_request:
    branches:
      - qa
    paths-ignore:
      - 'terraform/**'

env:
  NX_DAEMON: false
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  DOCKER_REGISTRY: docker.io
  DOCKER_NAMESPACE: jccasav

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install npm deps
        run: npm ci

      - name: Install Python deps (all services)
        run: |
          python -m pip install --upgrade pip
          for req in apps/*/requirements.txt; do
            pip install -r $req
          done

      - name: Detect base/head for nx affected
        id: nx-vars
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> $GITHUB_OUTPUT
            echo "head=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          else
            echo "base=origin/qa" >> $GITHUB_OUTPUT
            echo "head=HEAD" >> $GITHUB_OUTPUT
          fi

      - name: Run tests (affected only)
        run: |
          npx nx affected -t test \
            --base=${{ steps.nx-vars.outputs.base }} \
            --head=${{ steps.nx-vars.outputs.head }}

      - name: Docker login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker build & push (affected only)
        if: github.event_name == 'push'
        env:
          IMAGE_TAG: qa
          IMAGE_TAG_SHA: qa-${{ github.sha }}
        run: |
          export IMAGE_TAG IMAGE_TAG_SHA
          npx nx affected -t docker-push \
            --base=${{ steps.nx-vars.outputs.base }} \
            --head=${{ steps.nx-vars.outputs.head }}
