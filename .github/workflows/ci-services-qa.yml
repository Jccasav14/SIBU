name: CI Services QA

on:
  push:
    branches:
      - qa
      - 'feature/**'
    paths-ignore:
      - 'terraform/**'

  pull_request:
    branches:
      - qa
    paths-ignore:
      - 'terraform/**'

env:
  NX_DAEMON: false
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  PYTHONWARNINGS: "ignore::DeprecationWarning,ignore::PendingDeprecationWarning,ignore::pytest.PytestDeprecationWarning"

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------------------------------
      # Necesario para nx affected
      # -------------------------------------------------
      - name: Fetch all remote refs
        run: |
          git fetch --no-tags --prune origin +refs/heads/*:refs/remotes/origin/*

      # -------------------------------------------------
      # Node
      # -------------------------------------------------
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # -------------------------------------------------
      # Python
      # -------------------------------------------------
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      # -------------------------------------------------
      # Install deps
      # -------------------------------------------------
      - name: Install npm deps
        run: npm ci

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          for req in apps/*/requirements.txt; do
            pip install -r "$req"
          done

      # -------------------------------------------------
      # Detect base/head CORRECTO
      # -------------------------------------------------
      - name: Detect base/head for nx affected
        id: nx-vars
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
            echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            if [[ "${{ github.ref_name }}" == "qa" ]]; then
              # Push directo a qa → comparar contra commit anterior
              echo "base=HEAD^" >> "$GITHUB_OUTPUT"
              echo "head=HEAD" >> "$GITHUB_OUTPUT"
            else
              # Push a feature/** → comparar contra qa
              BASE_SHA="$(git merge-base origin/qa HEAD)"
              echo "base=$BASE_SHA" >> "$GITHUB_OUTPUT"
              echo "head=HEAD" >> "$GITHUB_OUTPUT"
            fi
          fi

      # -------------------------------------------------
      # (Opcional pero recomendado) Debug
      # -------------------------------------------------
      - name: Debug affected projects
        run: |
          npx nx print-affected \
            --base=${{ steps.nx-vars.outputs.base }} \
            --head=${{ steps.nx-vars.outputs.head }} \
            --select=projects

      # -------------------------------------------------
      # Tests (SOLO proyectos afectados)
      # -------------------------------------------------
      - name: Run tests (affected only)
        run: |
          npx nx affected -t test \
            --base=${{ steps.nx-vars.outputs.base }} \
            --head=${{ steps.nx-vars.outputs.head }}

      # -------------------------------------------------
      # Docker login (solo en push)
      # -------------------------------------------------
      - name: Docker login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # -------------------------------------------------
      # Docker build & push (affected only)
      # -------------------------------------------------
      - name: Docker build & push (affected only)
        if: github.event_name == 'push'
        env:
          DOCKER_TAG_1: qa
          DOCKER_TAG_2: qa-${{ github.sha }}
        run: |
          npx nx affected -t docker-push \
            --base=${{ steps.nx-vars.outputs.base }} \
            --head=${{ steps.nx-vars.outputs.head }}
