name: CI Services PROD

on:
  pull_request:
    branches: [ "prod" ]
    paths:
      - "apps/**"
      - "libs/**"
      - "docker/**"
      - "nx.json"
      - "package.json"
      - "package-lock.json"

concurrency:
  group: ci-services-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci

      - name: Tests afectados (PROD)
        env:
          NX_DAEMON: "false"
        run: |
          npx nx affected -t test --parallel=3 \
            --base=origin/prod --head=${{ github.sha }}

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - uses: docker/setup-buildx-action@v3

      - name: DockerHub login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker (PROD - affected only)
        env:
          NX_DAEMON: "false"
          DOCKER_TAG_1: prod
          DOCKER_TAG_2: prod-${{ github.sha }}
        run: |
          npx nx affected -t docker-push --parallel=2 \
            --base=origin/prod --head=${{ github.sha }}
