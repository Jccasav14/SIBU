name: QA Infra (Terraform apply)

on:
  push:
    branches: ["qa"]
    paths:
      - "infra/qa/**"
      - ".github/workflows/qa-infra.yml"
      # Evita loop: no dispares el workflow cuando solo cambie el state
      - "!infra/qa/terraform/state/**"

concurrency:
  group: qa-infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    if: github.actor != 'github-actions[bot]'

    env:
      AWS_REGION: us-east-1
      TF_IN_AUTOMATION: "true"

    steps:
      - name: Checkout (qa)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (QA)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Restore QA state from repo
        working-directory: infra/qa/terraform
        run: |
          mkdir -p state/qa
          if [ -f state/qa/terraform.tfstate ]; then
            cp state/qa/terraform.tfstate terraform.tfstate
          fi
          if [ -f state/qa/terraform.tfstate.backup ]; then
            cp state/qa/terraform.tfstate.backup terraform.tfstate.backup
          fi

      - name: Terraform Init
        working-directory: infra/qa/terraform
        run: terraform init -reconfigure

      - name: Terraform Validate
        working-directory: infra/qa/terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: infra/qa/terraform
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        working-directory: infra/qa/terraform
        run: terraform apply -auto-approve tfplan

      - name: Save updated QA state into repo
        working-directory: infra/qa/terraform
        run: |
          mkdir -p state/qa
          cp terraform.tfstate state/qa/terraform.tfstate
          if [ -f terraform.tfstate.backup ]; then
            cp terraform.tfstate.backup state/qa/terraform.tfstate.backup
          fi

      - name: Commit state (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add infra/qa/terraform/state/qa/terraform.tfstate infra/qa/terraform/state/qa/terraform.tfstate.backup || true
          git diff --cached --quiet && echo "No state changes to commit" && exit 0

          git commit -m "chore(qa): update terraform state [skip ci]"
          git push origin HEAD:qa
